<div id="lead-gate" class="lead-gate" aria-modal="true" role="dialog">
    <div class="lead-box">
        <div class="lead-badge">MÉTODO SWAY</div>

        <h2>Antes de continuar</h2>

        <p>
            Preencha seus dados para acessar o conteúdo do Método SWAY.
        </p>

        <form id="lead-form" novalidate>
            <label for="lead-name">Nome</label>
            <input
                id="lead-name"
                name="nome"
                type="text"
                autocomplete="name"
                placeholder="Seu nome"
                required
            >

            <label for="lead-whatsapp">WhatsApp</label>
            <input
                id="lead-whatsapp"
                name="whatsapp"
                type="tel"
                autocomplete="tel"
                inputmode="tel"
                placeholder="(00) 00000-0000"
                required
            >

            <label for="lead-email">E-mail</label>
            <input
                id="lead-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="seuemail@exemplo.com"
                required
            >

            <button type="submit" id="lead-submit">
                CONTINUAR
                <span>→</span>
            </button>

            <p id="lead-message" class="lead-message" aria-live="polite"></p>

            <small>
                Seus dados serão usados para registro do lead e comunicação relacionada ao Método SWAY.
            </small>
        </form>
    </div>
</div>
