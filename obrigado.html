<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compra Confirmada | Método SWAY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;

            background:
                radial-gradient(circle at top, #34115e 0%, #13051f 35%, #050507 75%);

            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 600px;

            background: rgba(15, 10, 22, 0.92);

            border: 1px solid rgba(155, 70, 255, 0.35);
            border-radius: 24px;

            padding: 50px 35px;

            text-align: center;

            box-shadow:
                0 0 50px rgba(132, 0, 255, 0.18);
        }

        .check {
            width: 75px;
            height: 75px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #7b2cff, #b35cff);

            font-size: 38px;

            box-shadow:
                0 0 30px rgba(155, 70, 255, 0.45);
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .highlight {
            color: #a855f7;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #d1d1d1;
            margin-bottom: 18px;
        }

        .info {
            margin-top: 30px;

            padding: 20px;

            background: rgba(132, 0, 255, 0.08);

            border: 1px solid rgba(155, 70, 255, 0.20);
            border-radius: 15px;
        }

        .info p {
            margin: 0;
            font-size: 15px;
        }

        .brand {
            margin-top: 35px;
            font-weight: bold;
            color: #a855f7;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="check">✓</div>

        <h1>
            Compra <span class="highlight">confirmada!</span>
        </h1>

        <p>
            Obrigado por adquirir o
            <strong>Método SWAY — Gatilhos + Script de WhatsApp.</strong>
        </p>

        <p>
            Seu pagamento foi aprovado.
        </p>

        <div class="info">
            <p>
                📩 Confira seu e-mail e WhatsApp para receber as informações
                de acesso ao seu produto.
            </p>
        </div>

        <div class="brand">
            VG SWAY
        </div>

    </main>

</body>

</html>
